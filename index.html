  /* Bento: claro, tarjetas azul-niebla de esquinas grandes, anillos de progreso, controles oscuros en píldora */
  [data-theme="bento"]{
    --bg:#FFFFFF;

  /* Showroom: blanco/gris con un solo azul para las acciones, plano y sobrio (inspirado en estilos de sitios de autos) */
  [data-theme="showroom"]{

    --green:#1A7F37; --green-dim:#E2F3E6; --amber:#8F5B00; --amber-dim:#FFF0CC; --red:#C0392B; --red-dim:#FDEAE7; --red-line:#F2BDB6;

    --accent-grad-1:#3E6AE1; --accent-grad-2:#3E6AE1; --accent-ink:#FFFFFF; --surface-deep:#FFFFFF; --glow-1:#FFFFFF;

  [data-theme="showroom"] .tile,[data-theme="showroom"] .radar-chip{background:var(--panel);border-color:transparent;box-shadow:none;}
  [data-theme="showroom"] .countdown-hero.urgent{background:var(--red-dim);}
  [data-theme="showroom"] .plate::before{display:none;}
  [data-theme="showroom"] .odo{background:#fff;border-color:var(--line);}
  [data-theme="showroom"] .dot{box-shadow:none !important;}
  [data-theme="showroom"] .btn,[data-theme="showroom"] .mini-btn,[data-theme="showroom"] .export-btn,[data-theme="showroom"] .filter-btn,

  [data-theme="showroom"] .filter-btn.active,[data-theme="showroom"] .veh-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* Medianoche: casi negro, bordes finos, planos, un solo acento verde-lima (inspirado en herramientas de producto) */
  [data-theme="medianoche"]{
    --bg:#08090A; --panel:#0F1011; --panel-2:#161718; --line:#23252A; --line-soft:#1A1C1F;
    --text:#F2F3F4; --text-dim:#8A8F98; --text-faint:#70747C;
    --green:#27A644; --green-dim:#10291A; --amber:#F0B429; --amber-dim:#2E2410; --red:#EB5757; --red-dim:#2E1415; --red-line:#4A2224;
    --accent:#E4F222; --accent-dim:#1B1E08; --accent-line:#3F4511; --accent-rgb:228,242,34;
    --accent-grad-1:#E4F222; --accent-grad-2:#E4F222; --accent-ink:#08090A; --surface-deep:#000000; --glow-1:#0B0C0D;
    --radius:12px; --radius-sm:8px;
  }
  [data-theme="medianoche"] body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.015em;}
  [data-theme="medianoche"] .plate-title{font-size:24px;font-weight:500;letter-spacing:-.025em;}

  [data-theme="medianoche"] .btn-primary{background:var(--accent);color:var(--accent-ink);}
  [data-theme="medianoche"] .fab{background:var(--accent);color:var(--accent-ink);box-shadow:none;}
  [data-theme="medianoche"] .overlay{background:rgba(0,0,0,.6);backdrop-filter:none;}
  [data-theme="medianoche"] .bv-bar,[data-theme="medianoche"] .bh-fill{background:var(--accent);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--glow-1) 0%, var(--bg) 55%);
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  /* ---------- App shell ---------- */
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 0;}

  /* ---------- Header / nameplate ---------- */
  .plate{
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
  }
  .plate::before{
    content:"";
    position:absolute;top:-40%;right:-20%;width:220px;height:220px;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.10),transparent 70%);
    pointer-events:none;
  }
  .plate-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .plate-eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);font-weight:600;margin:0 0 4px;
  }
  .plate-title{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .plate-sub{color:var(--text-dim);font-size:13px;margin:4px 0 0;}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .icon-btn:active{background:var(--line);}
  .icon-btn svg{width:16px;height:16px;}

  .odo{
    margin-top:16px;
    background:var(--surface-deep);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .odo-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
  .odo-value{font-size:26px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin-top:2px;}
  .odo-value span{font-size:13px;color:var(--text-dim);font-weight:500;margin-left:4px;}
  .odo-edit{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);background:var(--accent-dim);padding:7px 10px;border-radius:8px;font-weight:600;}
  .save-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:10px;padding-left:2px;}
  .save-indicator .dot{width:6px;height:6px;}

  /* ---------- Countdown hero ---------- */
  .countdown-hero{
    margin-top:14px;background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .countdown-hero.urgent{border-color:var(--red-line);background:linear-gradient(160deg,var(--red-dim),var(--panel));}
  .ch-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
  .ch-title{font-size:14.5px;font-weight:700;margin-top:3px;}

  /* ---------- Radar strip ---------- */
  .radar-section{margin-top:18px;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .filter-btn{
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;

  .card-actions{display:flex;gap:6px;margin-top:10px;}
  .mini-btn{
    font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;
    background:linear-gradient(160deg,var(--accent-grad-1),var(--accent-grad-2));color:var(--accent-ink);

  .overlay{

  datalist{}

  .loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--text-dim);font-size:13px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Cargando bitácora…</div>
</div>

<button class="fab" id="fabAdd" aria-label="Agregar servicio">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================= ICONS ======================= */
const ICONS = {
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-4l2-5h12l3 5v4h-2"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18 4.5 4.5 0 0 0 0-9 3 3 0 0 1 0-9Z" fill="currentColor" stroke="none"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'
};

/* ======================= TEMAS ======================= */
const THEMES = [
  {id:'azul', name:'Oscuro Azul', colors:['#10141A','#57C7FF','#1A2128']},
  {id:'esmeralda', name:'Oscuro Esmeralda', colors:['#10141A','#34D9A0','#1A2128']},
  {id:'amoled', name:'AMOLED Negro', colors:['#000000','#57C7FF','#0A0A0A']},
  {id:'claro', name:'Claro', colors:['#F3F5F7','#0B84C4','#FFFFFF']},
  {id:'papel', name:'Papel', colors:['#FFF8F1','#0060E0','#E2E8F0']},
  {id:'bento', name:'Bento', colors:['#FFFFFF','#415EEE','#EBF0F8']},
  {id:'showroom', name:'Showroom', colors:['#FFFFFF','#3E6AE1','#F4F4F4']},
  {id:'medianoche', name:'Medianoche', colors:['#08090A','#E4F222','#0F1011']},
];
function getTheme(){ try{ return localStorage.getItem('bitacora-theme')||'azul'; }catch(e){ return 'azul'; } }
function setTheme(id){
  document.documentElement.setAttribute('data-theme', id);
  try{ localStorage.setItem('bitacora-theme', id); }catch(e){}
}
function openThemeSheet(){
  const current = getTheme();
  openSheet(`
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">Tema <button class="icon-btn" id="closeSheet">${ICONS.close}</button></h2>
    <div class="theme-grid">
      ${THEMES.map(t=>`
        <button class="theme-opt ${t.id===current?'active':''}" data-theme-pick="${t.id}">
          <div class="theme-swatch">${t.colors.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
          <div class="theme-opt-name">${t.name}</div>
        </button>
      `).join('')}
    </div>
  `);
  document.getElementById('closeSheet').onclick = closeSheet;
  document.querySelectorAll('[data-theme-pick]').forEach(el=> el.onclick = ()=>{
    setTheme(el.dataset.themePick);
    closeSheet();
  });
}

/* ======================= STATE ======================= */
let state = null;
let filter = 'todos'; // todos | vencido | por_vencer | al_dia | sin_programar
let editingId = null; // null = add mode

const TIPOS_SUGERIDOS = ["Tecnomecánica","SOAT","Impuesto vehicular","Cambio de aceite","Cambio filtro de aceite","Cambio filtro de aire","Anticongelante","Alineación de ruedas","Rotación de neumáticos","Reemplazo de neumáticos","Ajuste de frenos","Extintor","Limpieza de inyectores","Cambio de bujías","Cambio de aceite de transmisión","Batería","Correa de distribución","Balanceo","Revisión de suspensión"];

function blankRecord(id, vid, tipo){
  return {id, vehicleId:vid, tipo, fechaRealizado:null, kmServicio:null, valor:null, proxFecha:null, proxKm:null, taller:'', observaciones:'', foto:null};
}
function blankVehicle(id){
  return {id, propietario:'', marca:'', modelo:'Mi vehículo', anio:null, placa:'', kmActual:0, combustible:'', color:'', telefono:'', chasis:'', motor:''};
}
function seedState(){
  const recs = ["Tecnomecánica","SOAT","Impuesto vehicular","Cambio de aceite","Cambio filtro de aceite","Cambio filtro de aire","Alineación de ruedas","Rotación de neumáticos","Ajuste de frenos","Extintor"]
    .map((t,i)=>blankRecord(i+1, 1, t));
  return {schema:2, pristine:true, rev:0, nextId:recs.length+1, nextVid:2, vehicles:[blankVehicle(1)], records:recs};
}
/* Acepta el formato viejo (un solo vehículo: {vehicle, records}) y el nuevo (vehicles[]). */
function migrate(d){
  if(!d || typeof d!=='object' || !Array.isArray(d.records)) return null;
  if(Array.isArray(d.vehicles)){
    if(!d.vehicles.length) d.vehicles.push(blankVehicle(1));
    const firstId = d.vehicles[0].id;
    d.records.forEach(r=>{ if(r.vehicleId==null) r.vehicleId = firstId; if(r.foto===undefined) r.foto = null; });
    d.schema = 2;
    d.nextId = Math.max(Number(d.nextId)||0, 1+d.records.reduce((m,r)=>Math.max(m,r.id||0),0));
    d.nextVid = Math.max(Number(d.nextVid)||0, 1+d.vehicles.reduce((m,v)=>Math.max(m,v.id||0),0));
    d.rev = Number(d.rev)||0;
    return d;
  }
  if(d.vehicle){
    d.records.forEach(r=>{ r.vehicleId = 1; r.foto = null; });
    return migrate({schema:2, rev:0, nextId:d.nextId, nextVid:2, lastIcsSyncAt:d.lastIcsSyncAt, vehicles:[{...d.vehicle, id:1}], records:d.records});
  }
  return null;
}

/* ======================= VEHÍCULO ACTIVO ======================= */
const VEH_SEL_KEY = 'bitacora-vehicle';
function curV(){
  let id = null;
  try{ id = Number(localStorage.getItem(VEH_SEL_KEY)); }catch(e){}
  return state.vehicles.find(v=>v.id===id) || state.vehicles[0];
}
function setCurV(id){ try{ localStorage.setItem(VEH_SEL_KEY, String(id)); }catch(e){} }
function curRecs(){ const id = curV().id; return state.records.filter(r=>r.vehicleId===id); }
function vehTitle(v){
  const marca = v.marca && !String(v.modelo||'').toLowerCase().startsWith(String(v.marca).toLowerCase()) ? v.marca : '';
  return [marca, v.modelo].filter(Boolean).join(' ') + (v.anio ? ' · '+v.anio : '');
}

/* ======================= STORAGE =======================
   Local (localStorage / window.storage) siempre; si hay nube configurada,
   además se sincroniza con Google Sheets vía Apps Script (ver apps-script/Code.gs).
   Copia manual en JSON como red de seguridad. */
const LS_KEY = 'bitacora-vehiculo-v1';   // misma clave de siempre: los datos locales existentes se migran solos
const CLOUD_KEY = 'bitacora-cloud';
const DEFAULT_CLOUD_URL = 'https://script.google.com/macros/s/AKfycbxoUrFe9-9t_YkKuLTGpu4ZTcbXX9rF5yZaV7IcetrpXaxYGmOWrXqgjxVY9F0HMO8/exec'; // solo la URL; la clave nunca va en el código
const DIRTY_KEY = 'bitacora-dirty';
let saveOk = true;

async function tryGetSaved(){
  if(window.storage){
    try{
      const res = await window.storage.get('vehiculo:main', false);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* no existe todavía, normal la primera vez */ }
  }
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* localStorage bloqueado en este contexto */ }
  return null;
}
async function tryPersist(){
  let ok = false;
  if(window.storage){
    try{ await window.storage.set('vehiculo:main', JSON.stringify(state), false); ok = true; }catch(e){ console.error('window.storage falló', e); }
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); ok = true; }catch(e){ console.error('localStorage falló', e); }
  return ok;
}

/* ---- Estado de la nube ---- */
let cloud = null;            // {url, key} | null
let syncState = 'local';     // local | ok | syncing | pending | error | badkey | conflict
let syncing = false, resync = false, localVer = 0, syncTimer = null;
try{ cloud = JSON.parse(localStorage.getItem(CLOUD_KEY)||'null'); }catch(e){ cloud = null; }
function isDirty(){ try{ return localStorage.getItem(DIRTY_KEY)==='1'; }catch(e){ return false; } }
function setDirty(v){ try{ v ? localStorage.setItem(DIRTY_KEY,'1') : localStorage.removeItem(DIRTY_KEY); }catch(e){} }
function setSync(s){ syncState = s; updateSaveIndicator(); }

async function api(action, payload){
  const r = await fetch(cloud.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // text/plain evita el preflight CORS que Apps Script no responde
    body: JSON.stringify({action, key:cloud.key, ...payload})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(j.error){ const e = new Error(j.error); e.code = j.error; throw e; }
  return j;
}
function cleanForCloud(){
  const p = JSON.parse(JSON.stringify(state));
  delete p.rev; delete p.pristine;
  return p;
}
function adoptCloud(j){
  const s = migrate(j.state);
  s.rev = j.rev;
  state = s;
  setDirty(false);
  return tryPersist().then(()=>render());
}
let lastSyncAt = 0;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 400); }

async function syncNow(){
  if(!cloud) return;
  if(syncing){ resync = true; return; }
  syncing = true; setSync('syncing');
  try{
    do{
      resync = false;
      // ruta rápida: con cambios locales y revisión conocida se sube directo (1 viaje en vez de 2); si hay conflicto el servidor lo avisa
      if(isDirty() && state.rev > 0 && !state.pristine){
        await pushState(state.rev);
        continue;
      }
      const j = await api('get');
      if(!j.state){
        if(state.pristine) break;   // instalación vacía con datos de plantilla: nunca subirla a una nube vacía
        await pushState(0);
      } else if(!isDirty()){
        const incoming = migrate(j.state); incoming.rev = j.rev;
        if(JSON.stringify(incoming) !== JSON.stringify({...state, pristine:undefined})) await adoptCloud(j);
        else if(state.rev !== j.rev){ state.rev = j.rev; await tryPersist(); }
      } else if(j.rev === state.rev){
        await pushState(j.rev);
      } else {
        setSync('conflict'); openConflictSheet(j); return;
      }
    }while(resync);
    setSync('ok');
  }catch(e){
    console.error('sync', e);
    if(e.code !== 'conflict') setSync(e.code==='clave' ? 'badkey' : (isDirty() ? 'pending' : 'error'));
  }finally{ syncing = false; lastSyncAt = Date.now(); }
}
async function pushState(baseRev){
  const ver = localVer;
  const j = await api('save', {baseRev, state:cleanForCloud()});
  if(j.conflict){ setSync('conflict'); openConflictSheet(j); throw Object.assign(new Error('conflict'), {code:'conflict'}); }
  state.rev = j.rev;
  if(ver === localVer) setDirty(false); else resync = true;
  await tryPersist();
}

/* ---- Fotos de facturas (se guardan en Drive vía Apps Script; en el registro solo va el ID) ---- */
let pendingPhoto = null;   // dataURL nuevo | 'remove' | null
function fileToDataUrl(file, maxDim=1280, q=0.72){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(1, maxDim/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('imagen inválida')); };
    img.src = url;
  });
}
async function applyPendingPhoto(rec){
  const p = pendingPhoto; pendingPhoto = null;

    if(p === 'remove'){ rec.foto = null; }

    await saveState(); render();

  }
}

/* ---- Copia de seguridad manual (JSON) — funciona siempre, sin depender del navegador ---- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(cleanForCloud(), null, 2)], {type:'application/json'});

  showToast('💾 Copia de seguridad descargada');
}

}

/* ======================= LOGIC ======================= */
function todayMid(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - todayMid())/86400000);
}
function computeEstado(r){
  const hasFecha = !!r.proxFecha;
  const hasKm = r.proxKm !== null && r.proxKm !== undefined && r.proxKm !== '';
  if(!hasFecha && !hasKm) return {status:'sin_programar', daysLeft:null, kmLeft:null};
  const daysLeft = hasFecha ? daysBetween(r.proxFecha) : null;
  const kmLeft = hasKm ? (Number(r.proxKm) - Number(curV().kmActual||0)) : null;
  const vencidoDate = daysLeft !== null && daysLeft < 0;
  const vencidoKm = kmLeft !== null && kmLeft <= 0;
  const porVencerDate = daysLeft !== null && daysLeft >= 0 && daysLeft <= 30;
  const porVencerKm = kmLeft !== null && kmLeft > 0 && kmLeft <= 1000;
  let status = 'al_dia';
  if(vencidoDate || vencidoKm) status = 'vencido';
  else if(porVencerDate || porVencerKm) status = 'por_vencer';
  return {status, daysLeft, kmLeft};
}
const STATUS_RANK = {vencido:0, por_vencer:1, al_dia:2, sin_programar:3};
const STATUS_LABEL = {vencido:'Vencido', por_vencer:'Por vencer', al_dia:'Al día', sin_programar:'Sin programar'};

function fmtCOP(n){
  if(n===null||n===undefined||n==='') return '—';
  return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
}
function fmtKm(n){ return (n===null||n===undefined||n==='') ? '—' : new Intl.NumberFormat('es-CO').format(n)+' km'; }
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return new Intl.DateTimeFormat('es-CO',{day:'2-digit',month:'short',year:'numeric'}).format(d);
}
function urgencyScore(r,ev){
  const {status,daysLeft,kmLeft} = ev;
  let val = 999999;
  if(daysLeft!==null) val = Math.min(val, daysLeft);
  if(kmLeft!==null) val = Math.min(val, kmLeft/40); // rough km->days equivalence
  return val;
}

        <button class="filter-btn ${filter===f?'active':''}" data-filter="${f}">${f==='todos'?'Todos':STATUS_LABEL[f]}</button>
      `).join('')}
    </div>
    <div class="toolbar">
      <button class="export-btn" id="btnStats" style="margin-left:0">${ICONS.chart} Gastos</button>
    </div>

    <div class="list">
      ${listItems.length? listItems.map(({r,ev})=>renderCard(r,ev)).join('') : '<div class="empty-state">No hay servicios en esta categoría.</div>'}
    </div>

    <div class="toolbar" style="margin-top:26px">
      <button class="export-btn" id="btnBackup">${ICONS.download} Descargar copia</button>
      <button class="export-btn" id="btnRestore">${ICONS.upload} Restaurar copia</button>
      <input type="file" id="fileRestore" accept="application/json" style="display:none">
    </div>
  `;

  // listeners
  document.getElementById('btnTheme').onclick = openThemeSheet;
  document.getElementById('btnCloud').onclick = openCloudSheet;
  document.getElementById('btnStats').onclick = openStatsSheet;
  document.getElementById('btnAddVeh').onclick = ()=>openVehicleSheet(false, true);
  document.querySelectorAll('[data-veh]').forEach(el=> el.onclick = ()=>{ setCurV(Number(el.dataset.veh)); filter='todos'; render(); });
  document.getElementById('btnEditVehicle').onclick = ()=>openVehicleSheet();
  document.getElementById('btnEditKm').onclick = ()=>openVehicleSheet(true);
  document.getElementById('btnBackup').onclick = exportBackup;
  document.getElementById('btnRestore').onclick = ()=>document.getElementById('fileRestore').click();
  document.getElementById('fileRestore').onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importBackupFile(file);
    e.target.value = '';
  };
  updateSaveIndicator();
  document.querySelectorAll('.filter-btn').forEach(b=> b.onclick = ()=>{ filter=b.dataset.filter; render(); });
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=>{
    const id = Number(el.dataset.open);
    document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth',block:'center'});
    openRecordSheet(id);
  });
  document.querySelectorAll('[data-edit]').forEach(el=> el.onclick = ()=> openRecordSheet(Number(el.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(el=> el.onclick = ()=> deleteRecord(Number(el.dataset.del)));
  document.querySelectorAll('[data-photo]').forEach(el=> el.onclick = ()=> viewPhoto(el.dataset.photo));
  tickCountdowns();
}

/* ---- Live countdown (updates every minute without full re-render) ---- */
function msUntilDate(dateStr){ return new Date(dateStr+'T00:00:00') - new Date(); }
function formatCountdown(ms){
  const past = ms < 0;
  const abs = Math.abs(ms);
  const days = Math.floor(abs/86400000);
  const hours = Math.floor((abs%86400000)/3600000);
  const mins = Math.floor((abs%3600000)/60000);
  let str;
  if(days>0) str = `${days}d ${hours}h`;
  else if(hours>0) str = `${hours}h ${mins}m`;
  else str = `${mins}m`;
  return past ? `Vencido hace ${str}` : `Faltan ${str}`;
}
function tickCountdowns(){
  document.querySelectorAll('[data-countdown-target]').forEach(el=>{
    const target = el.getAttribute('data-countdown-target');
    const ms = msUntilDate(target);
    el.textContent = formatCountdown(ms);
    el.classList.toggle('urgent', ms < 3*86400000);
  });
}

function renderCountdownHero(evaluated){
  const withFecha = evaluated.filter(({r})=>r.proxFecha);
  if(!withFecha.length) return '';
  const top = withFecha.sort((a,b)=> msUntilDate(a.r.proxFecha)-msUntilDate(b.r.proxFecha))[0];
  const ms = msUntilDate(top.r.proxFecha);
  const urgent = ms < 3*86400000;
  return `
    <div class="countdown-hero ${urgent?'urgent':''}">
      <div>
        <div class="ch-label">Próximo vencimiento</div>
        <div class="ch-title">${esc(top.r.tipo)}</div>
      </div>
      <div class="ch-time" data-countdown-target="${top.r.proxFecha}">${formatCountdown(ms)}</div>
    </div>
  `;
}

function radarSub(ev){
  if(ev.daysLeft!==null){
    if(ev.daysLeft<0) return `hace ${Math.abs(ev.daysLeft)}d`;
    return `en ${ev.daysLeft}d`;
  }
  if(ev.kmLeft!==null){
    if(ev.kmLeft<=0) return `+${Math.abs(Math.round(ev.kmLeft))}km`;
    return `en ${Math.round(ev.kmLeft)}km`;
  }
  return '';
}

function renderCard(r, ev){
  const metaBits = [];
  if(r.fechaRealizado) metaBits.push(`Último: <b>${fmtDate(r.fechaRealizado)}</b>`);
  if(r.proxFecha) metaBits.push(`Próx. fecha: <b>${fmtDate(r.proxFecha)}</b> &nbsp;<span class="card-countdown" data-countdown-target="${r.proxFecha}">${formatCountdown(msUntilDate(r.proxFecha))}</span>`);
  if(r.proxKm) metaBits.push(`Próx. km: <b>${fmtKm(r.proxKm)}</b>`);
  if(r.valor) metaBits.push(`Valor: <b>${fmtCOP(r.valor)}</b>`);
  return `
    <div class="card" id="card-${r.id}">
      <div class="card-top">
        <div class="card-dot-col"><span class="dot ${ev.status}"></span></div>
        <div class="card-main">
          <div class="card-title-row">
            <div class="card-title">${esc(r.tipo)||'(Sin nombre)'}</div>
            <div class="card-badge ${ev.status}">${STATUS_LABEL[ev.status]}</div>
          </div>
          <div class="card-meta">${metaBits.length? metaBits.join(' &nbsp;·&nbsp; ') : '<span>Sin datos aún</span>'}</div>
          ${r.taller? `<div class="card-meta">Taller: <b>${esc(r.taller)}</b></div>`:''}
          ${r.observaciones? `<div class="card-meta">${esc(r.observaciones)}</div>`:''}
          <div class="card-actions">
            <button class="mini-btn" data-edit="${r.id}">${ICONS.pencil} Editar</button>
            ${r.foto && cloud? `<button class="mini-btn" data-photo="${esc(r.foto)}">${ICONS.camera} Factura</button>`:''}
            <button class="mini-btn danger" data-del="${r.id}">${ICONS.trash}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ======================= MODALS ======================= */
const overlay = document.getElementById('overlay');
const sheetEl = document.getElementById('sheet');
function openSheet(html){ sheetEl.innerHTML = html; overlay.classList.add('open'); }
function closeSheet(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheet(); });

function openRecordSheet(id){
  editingId = id || null;
  const r = id ? state.records.find(x=>x.id===id) : {tipo:'',fechaRealizado:'',kmServicio:'',valor:'',proxFecha:'',proxKm:'',taller:'',observaciones:'',foto:null};
  pendingPhoto = null;
  openSheet(`
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">${id? 'Editar servicio':'Nuevo servicio'} <button class="icon-btn" id="closeSheet">${ICONS.close}</button></h2>
    <div class="field">
      <label>Tipo de servicio</label>
      <input id="f_tipo" list="tipos" value="${esc(r.tipo)}" placeholder="Ej. Cambio de aceite">
      <datalist id="tipos">${TIPOS_SUGERIDOS.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha realizado</label><input id="f_fecha" type="date" value="${r.fechaRealizado||''}"></div>
      <div class="field"><label>Km al servicio</label><input id="f_km" type="number" value="${r.kmServicio??''}" placeholder="43200"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Próx. fecha programada</label><input id="f_proxfecha" type="date" value="${r.proxFecha||''}"></div>
      <div class="field"><label>Próx. km programado</label><input id="f_proxkm" type="number" value="${r.proxKm??''}" placeholder="53200"></div>
    </div>
    <div class="field"><label>Valor pagado (COP)</label><input id="f_valor" type="number" value="${r.valor??''}" placeholder="150000"></div>
    <div class="field"><label>Taller / responsable</label><input id="f_taller" value="${esc(r.taller)}" placeholder="Nombre del taller"></div>
    <div class="field"><label>Observaciones</label><textarea id="f_obs">${esc(r.observaciones)}</textarea></div>
    <div class="field"><label>Factura / foto</label>
      ${cloud ? `<input id="f_photo" type="file" accept="image/*">
        <div id="photoPrev">${r.foto? '<span class="hint-p">Ya tiene una foto guardada. Elige otra para reemplazarla, o <a href="#" id="photoRemove" style="color:var(--red)">quítala</a>.</span>':''}</div>`
      : '<p class="hint-p">Conecta la nube (botón ☁ arriba) para adjuntar fotos de facturas.</p>'}
    </div>
    <div class="sheet-actions">
      ${id? `<button class="btn btn-danger" id="btnDelete">Eliminar</button>`:''}
      <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
      <button class="btn btn-primary" id="btnSave">Guardar</button>
    </div>
  `);
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('btnCancel').onclick = closeSheet;
  if(id) document.getElementById('btnDelete').onclick = ()=>{ closeSheet(); deleteRecord(id); };
  document.getElementById('btnSave').onclick = saveRecordFromForm;
  const fp = document.getElementById('f_photo');
  if(fp) fp.onchange = async ()=>{
    const f = fp.files[0]; if(!f) return;
    try{
      pendingPhoto = await fileToDataUrl(f);
      document.getElementById('photoPrev').innerHTML = `<img class="photo-prev" alt="Vista previa" src="${pendingPhoto}">`;
    }catch(e){ pendingPhoto = null; showToast('No se pudo leer esa imagen.'); }
  };
  const pr = document.getElementById('photoRemove');
  if(pr) pr.onclick = (ev)=>{ ev.preventDefault(); pendingPhoto = 'remove'; document.getElementById('photoPrev').innerHTML = '<span class="hint-p">La foto se quitará al guardar.</span>'; };
}

async function saveRecordFromForm(){
  const tipo = document.getElementById('f_tipo').value.trim();
  if(!tipo){ showToast('Escribe el tipo de servicio.'); return; }
  const data = {
    tipo,
    fechaRealizado: document.getElementById('f_fecha').value || null,
    kmServicio: numOrNull(document.getElementById('f_km').value),
    proxFecha: document.getElementById('f_proxfecha').value || null,
    proxKm: numOrNull(document.getElementById('f_proxkm').value),
    valor: numOrNull(document.getElementById('f_valor').value),
    taller: document.getElementById('f_taller').value.trim(),
    observaciones: document.getElementById('f_obs').value.trim(),
  };
  let rec;
  if(editingId){
    const idx = state.records.findIndex(x=>x.id===editingId);
    rec = state.records[idx] = {...state.records[idx], ...data};
  } else {
    rec = {id: state.nextId++, vehicleId: curV().id, foto:null, ...data};
    state.records.push(rec);
  }
  await saveState();
  closeSheet();
  render();
  showToast('✅ Guardado');
  if(pendingPhoto) await applyPendingPhoto(rec);
}
function numOrNull(v){ return (v===''||v===null||v===undefined) ? null : Number(v); }

async function deleteRecord(id){
  if(!confirm('¿Eliminar este servicio del registro?')) return;
  const gone = state.records.find(r=>r.id===id);
  state.records = state.records.filter(r=>r.id!==id);
  await saveState();
  if(gone && gone.foto && cloud){ try{ await api('photo_del', {id:gone.foto}); }catch(e){ console.warn('foto huérfana en Drive', e); } }
  render();
  showToast('🗑️ Eliminado');
}

let addingVehicle = false;
function openVehicleSheet(focusKm, isNew){
  addingVehicle = !!isNew;
  const v = isNew ? blankVehicle(0) : curV();
  if(isNew) v.modelo = '';
  openSheet(`
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">${isNew?'Nuevo vehículo':'Datos del vehículo'} <button class="icon-btn" id="closeSheet">${ICONS.close}</button></h2>
    <div class="field-row">
      <div class="field"><label>Marca</label><input id="v_marca" value="${esc(v.marca)}"></div>
      <div class="field"><label>Modelo</label><input id="v_modelo" value="${esc(v.modelo)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Año</label><input id="v_anio" type="number" value="${v.anio??''}"></div>
      <div class="field"><label>Placa</label><input id="v_placa" value="${esc(v.placa)}"></div>
    </div>
    <div class="field"><label>Kilometraje actual</label><input id="v_km" type="number" value="${v.kmActual??''}"></div>
    <div class="field"><label>Propietario</label><input id="v_prop" value="${esc(v.propietario)}"></div>
    <div class="field-row">
      <div class="field"><label>Combustible</label><input id="v_comb" value="${esc(v.combustible)}"></div>
      <div class="field"><label>Color</label><input id="v_color" value="${esc(v.color)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>N° de motor</label><input id="v_motor" value="${esc(v.motor)}"></div>
      <div class="field"><label>N° de chasis</label><input id="v_chasis" value="${esc(v.chasis)}"></div>
    </div>
    <div class="field"><label>Teléfono de contacto</label><input id="v_tel" value="${esc(v.telefono)}"></div>
    <div class="sheet-actions">
      ${!isNew && state.vehicles.length>1? `<button class="btn btn-danger" id="btnDelVeh">Eliminar</button>`:''}
      <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
      <button class="btn btn-primary" id="btnSave">Guardar</button>
    </div>
  `);
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('btnCancel').onclick = closeSheet;
  document.getElementById('btnSave').onclick = saveVehicleFromForm;
  const dv = document.getElementById('btnDelVeh');
  if(dv) dv.onclick = deleteVehicle;
  if(focusKm) setTimeout(()=>document.getElementById('v_km').focus(),150);
}
async function deleteVehicle(){
  const v = curV();
  const n = state.records.filter(r=>r.vehicleId===v.id).length;
  if(!confirm(`¿Eliminar ${vehTitle(v)} y sus ${n} servicios? Esto no se puede deshacer.`)) return;
  const fotos = state.records.filter(r=>r.vehicleId===v.id && r.foto).map(r=>r.foto);
  state.records = state.records.filter(r=>r.vehicleId!==v.id);
  state.vehicles = state.vehicles.filter(x=>x.id!==v.id);
  setCurV(state.vehicles[0].id);
  await saveState();
  closeSheet(); render();
  if(cloud) for(const f of fotos){ try{ await api('photo_del', {id:f}); }catch(e){} }
  showToast('🗑️ Vehículo eliminado');
}
async function saveVehicleFromForm(){
  const base = addingVehicle ? blankVehicle(state.nextVid++) : curV();
  const nuevo = {
    ...base,
    marca: document.getElementById('v_marca').value.trim(),
    modelo: document.getElementById('v_modelo').value.trim(),
    anio: numOrNull(document.getElementById('v_anio').value),
    placa: document.getElementById('v_placa').value.trim(),
    kmActual: numOrNull(document.getElementById('v_km').value) || 0,
    propietario: document.getElementById('v_prop').value.trim(),
    combustible: document.getElementById('v_comb').value.trim(),
    color: document.getElementById('v_color').value.trim(),
    motor: document.getElementById('v_motor').value.trim(),
    chasis: document.getElementById('v_chasis').value.trim(),
    telefono: document.getElementById('v_tel').value.trim(),
  };
  if(addingVehicle){
    state.vehicles.push(nuevo);
    state.records.push(...["Tecnomecánica","SOAT","Impuesto vehicular","Cambio de aceite"].map(t=>blankRecord(state.nextId++, nuevo.id, t)));
    setCurV(nuevo.id);
  } else {
    state.vehicles[state.vehicles.findIndex(x=>x.id===nuevo.id)] = nuevo;
  }
  await saveState();
  closeSheet();
  render();
  showToast('✅ Datos actualizados');
}

/* ======================= TOAST ======================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

document.getElementById('fabAdd').onclick = ()=>openRecordSheet(null);

loadState();
setInterval(tickCountdowns, 60000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
